# Windows: Electron (NSIS setup + portable) desde v1.3.
# macOS / Linux: siguen con pkg hasta tray multiplataforma (v2.x).
#
# Uso:
# 1) Release con tag print-bridge-* → sube setup.exe + portable al release.
# 2) workflow_dispatch → artifacts descargables (sin release).
#
# URLs para el panel:
#   VITE_PRINT_BRIDGE_DOWNLOAD_URL  → setup.exe  (recomendado)
#   VITE_PRINT_BRIDGE_DOWNLOAD_URL_PORTABLE → portable win.exe

name: Print bridge — build & release (all platforms)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-attach:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'print-bridge-'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Electron binary cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-cache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('package-lock.json') }}

      - name: Write .env (PRINT_BRIDGE_TOKEN)
        shell: pwsh
        run: "'PRINT_BRIDGE_TOKEN=${{ secrets.PRINT_BRIDGE_TOKEN }}' | Out-File -FilePath .env -Encoding utf8"

      - name: Install dependencies and build Electron artifacts
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $attempts) { throw "npm ci failed after $attempts attempts" }
            $delay = $attempt * 20
            Write-Host "npm ci failed; retrying in $delay seconds (attempt $attempt/$attempts)"
            Start-Sleep -Seconds $delay
          }
          npm run dist:win

      - name: Verify artifacts
        shell: pwsh
        run: |
          @(
            "release/maxy-print-bridge-setup.exe",
            "release/maxy-print-bridge-win.exe"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing $_" }
            Get-Item $_ | Select-Object Name, Length
          }

      - name: Upload assets to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/maxy-print-bridge-setup.exe
            release/maxy-print-bridge-win.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: maxy-print-bridge-win-electron
          path: |
            release/maxy-print-bridge-setup.exe
            release/maxy-print-bridge-win.exe

  build-mac-x64:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'print-bridge-'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Electron binary cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-cache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('package-lock.json') }}

      - name: Write .env (PRINT_BRIDGE_TOKEN)
        run: echo "PRINT_BRIDGE_TOKEN=${{ secrets.PRINT_BRIDGE_TOKEN }}" > .env

      - name: Install dependencies and build macOS Intel DMG
        run: |
          for attempt in 1 2 3; do
            npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 20))
            echo "npm ci failed; retrying in ${delay}s (attempt ${attempt}/3)"
            sleep "$delay"
          done
          npm run dist:mac:x64

      - name: Verify artifact
        run: |
          p="release/maxy-print-bridge-mac-x64.dmg"
          [ -f "$p" ] || (echo "Missing $p" && exit 1)
          ls -lh "$p"

      - name: Upload asset to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/maxy-print-bridge-mac-x64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: maxy-print-bridge-mac-x64
          path: release/maxy-print-bridge-mac-x64.dmg

  build-mac-arm64:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'print-bridge-'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Electron binary cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-cache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('package-lock.json') }}

      - name: Write .env (PRINT_BRIDGE_TOKEN)
        run: echo "PRINT_BRIDGE_TOKEN=${{ secrets.PRINT_BRIDGE_TOKEN }}" > .env

      - name: Install dependencies and build macOS Apple Silicon DMG
        run: |
          for attempt in 1 2 3; do
            npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 20))
            echo "npm ci failed; retrying in ${delay}s (attempt ${attempt}/3)"
            sleep "$delay"
          done
          npm run dist:mac:arm64

      - name: Verify artifact
        run: |
          p="release/maxy-print-bridge-mac-arm64.dmg"
          [ -f "$p" ] || (echo "Missing $p" && exit 1)
          ls -lh "$p"

      - name: Upload asset to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/maxy-print-bridge-mac-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: maxy-print-bridge-mac-arm64
          path: release/maxy-print-bridge-mac-arm64.dmg

  build-linux-x64:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'print-bridge-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Electron binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-cache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('package-lock.json') }}

      - name: Install Linux dependencies for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libxss-dev libnss3-dev

      - name: Write .env (PRINT_BRIDGE_TOKEN)
        run: echo "PRINT_BRIDGE_TOKEN=${{ secrets.PRINT_BRIDGE_TOKEN }}" > .env

      - name: Install dependencies and build Linux AppImage
        run: |
          for attempt in 1 2 3; do
            npm ci --fetch-retries=5 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 && break
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 20))
            echo "npm ci failed; retrying in ${delay}s (attempt ${attempt}/3)"
            sleep "$delay"
          done
          npm run dist:linux

      - name: Verify artifact
        run: |
          p="release/maxy-print-bridge-linux-x64.AppImage"
          [ -f "$p" ] || (echo "Missing $p" && exit 1)
          ls -lh "$p"

      - name: Upload asset to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/maxy-print-bridge-linux-x64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: maxy-print-bridge-linux-x64
          path: release/maxy-print-bridge-linux-x64.AppImage
